[package]
name = "netdiagd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
libc = "0.2.189"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-packet-sock-diag = { version = "0.5.0", features = ["rich_nlas"] }
netlink-proto = "0.13.0"
netlink-sys = "0.9.0"
nix = { version = "0.31.3", features = ["socket", "uio", "net", "fs", "user"] }
prost = "0.14.4"
rtnetlink = "0.23.0"
smallvec = "1.16.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[build-dependencies]
prost-build = "0.14.4"

[profile.release]
# The binary ships inside the APK, so size is worth optimising for.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Deliberately not `panic = "abort"`: a panic in one collector should fail that
# one request, not take down a daemon the user may have several streams open
# against.
panic = "unwind"
