[package]
name = "netdiagd"
version = "0.1.0"
edition = "2024"

[dependencies]
netdiag-ipc = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
futures = "0.3.34"
libc = { workspace = true }
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-packet-sock-diag = { version = "0.5.0", features = ["rich_nlas"] }
netlink-proto = "0.13.0"
netlink-sys = "0.9.0"
nix = { version = "0.31.3", features = ["socket", "uio", "net", "fs", "user"] }
prost = { workspace = true }
rtnetlink = "0.23.0"
smallvec = "1.16.1"
thiserror = "2.0.20"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

