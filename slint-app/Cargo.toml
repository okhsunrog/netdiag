# Deliberately its own workspace: see the `exclude` in the repository root.
# Tracking Slint's master branch should not be in the daemon's dependency graph.
[workspace]

[package]
name = "netdiag-slint"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Slint frontend for the Android Network Inspector"

# Android entry points live in a cdylib loaded by NativeActivity; there is no
# main().
[lib]
crate-type = ["cdylib", "rlib"]

# Desktop harness: same UI, same client, talks to a daemon on this machine.
[[bin]]
name = "netdiag-slint-desktop"
path = "src/bin/desktop.rs"

[dependencies]
netdiag-ipc = { path = "../crates/netdiag-ipc" }
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
tracing = { version = "0.1.44", features = ["log"] }

# Slint from git: this build uses FlexboxLayout and the per-item
# cross-axis-self-alignment property, and the newest release is 1.17.1, which
# has neither. Switch to a version requirement once 1.18 ships.
#
# Pinned to an exact rev rather than `branch = "master"`. The lockfile pins it
# either way, but with a branch any `cargo update` silently moves this onto a
# different API — on someone else's main branch, which is not a thing to be
# moved onto by accident. Bumping it is then a commit that says so.
#
# 9405a2d is 2026-09-15; every one of the 19 crates from this repository
# resolves to it.
slint = { git = "https://github.com/slint-ui/slint", rev = "9405a2df5d9a3662e005909b44e3941ca47c2f47", default-features = false, features = [
    "compat-1-2",
    "std",
] }
libc = "0.2.189"

# The same UI runs on the desktop against a locally running daemon, which is
# how it is iterated on without a phone attached.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "9405a2df5d9a3662e005909b44e3941ca47c2f47", default-features = false, features = ["backend-winit", "renderer-femtovg"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
# Only for the harness's --snapshot flag, which renders the window to a file
# so the UI can be reviewed without capturing the developer's screen.
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "9405a2df5d9a3662e005909b44e3941ca47c2f47", default-features = false, features = ["backend-android-activity-06", "renderer-skia"] }
# The same jni version Slint's own Android backend uses, so there is one
# JavaVM binding in the process rather than two incompatible ones.
jni = "0.22"
android_logger = "0.15"
log = "0.4"

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "9405a2df5d9a3662e005909b44e3941ca47c2f47" }

[package.metadata.android]
package = "dev.okhsunrog.netdiag.slint"
build_targets = ["aarch64-linux-android"]
# The daemon binary rides along as a "native library" for the same reason as in
# the Compose build: the installer only extracts and marks executable the files
# matching lib*.so.
runtime_libs = "runtime-libs"
# Compiled into the APK's own classes.dex. `ConnectivityManager.NetworkCallback`
# has to be subclassed to receive anything and Rust cannot subclass a Java
# abstract class, so this one directory is the app's entire Java surface.
java_sources = ["java"]

[package.metadata.android.sdk]
min_sdk_version = 31
target_sdk_version = 34
compile_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

[package.metadata.android.application]
label = "Net Inspector (Slint)"
# The daemon must be a real file on disk for su to exec it.
extract_native_libs = true
debuggable = true

[profile.release]
# The binary ships inside an APK, so size matters.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
